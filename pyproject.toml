[project]
name = "nemucast"
version = "0.1.0"
description = "ねむキャス - Chromecast/Google TVの音量を徐々に下げて自動的にスタンバイモードにするツール"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pychromecast>=14.0.7",
    "python-dotenv>=1.0.0",
    # cast_client が InterfaceChoice を直接使うため、推移的依存に任せず自分で宣言する
    "zeroconf>=0.147.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = true

[project.scripts]
nemucast = "nemucast.cli:main"
nemucast-standby = "nemucast.standby:main"
nemucast-auto = "nemucast.auto_standby:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
